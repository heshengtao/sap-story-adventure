<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Story Adventure - TRPG</title>
<link rel="stylesheet" href="../../fontawesome/css/all.min.css">
<!-- 引入高级字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  /* 跑团高级暗金/羊皮纸色调 */
  --bg-base: #0a0a0a;
  --bg-gradient: radial-gradient(circle at 50% 0%, #1c1812 0%, #050505 90%);
  --surface: rgba(25, 25, 25, 0.6);
  --surface-hover: rgba(212, 175, 55, 0.08);
  --border-light: rgba(255, 255, 255, 0.08);
  --border-active: rgba(212, 175, 55, 0.4);
  
  --text-main: #eaeaea;
  --text-muted: #8a8a8a;
  --accent: #D4AF37; /* 古典鎏金 */
  --accent-glow: rgba(212, 175, 55, 0.25);
  
  --font-ui: 'Inter', -apple-system, sans-serif;
  --font-story: 'Noto Serif SC', serif;
  
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 4px;
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background-color: var(--bg-base);
  background-image: var(--bg-gradient);
  color: var(--text-main);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* 沉浸式噪点纹理，模拟暗色羊皮纸/桌面 */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.app-container {
  max-width: 1100px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 2vh 4vw;
  position: relative;
  z-index: 1;
}

/* 顶部导航 */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 24px;
  flex-shrink: 0;
}

.header-title {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.header-title h1 {
  font-family: var(--font-story);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 12px;
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
}

.header-title p {
  color: var(--text-muted);
  font-size: 13px;
  letter-spacing: 1px;
}

.header-actions {
  display: flex;
  gap: 14px;
  align-items: center;
}

/* 按钮通用样式 */
.btn-glass {
  background: var(--surface);
  border: 1px solid var(--border-light);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-glass:hover {
  background: var(--surface-hover);
  border-color: var(--border-active);
  color: var(--accent);
  box-shadow: inset 0 0 10px var(--accent-glow);
}

.btn-glass.hidden {
  display: none;
}

/* 滚动与主体区域 */
.main-content {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.scroll-container {
  flex: 1;
  overflow-y: auto;
  padding-right: 16px;
  scroll-behavior: smooth;
  padding-bottom: 60px;
}

.scroll-container::-webkit-scrollbar {
  width: 4px;
}
.scroll-container::-webkit-scrollbar-track {
  background: transparent;
}
.scroll-container::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 4px;
}
.scroll-container::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* TRPG 模组设定头 (当前世界观) */
.world-info-capsule {
  display: none;
  background: linear-gradient(135deg, rgba(20,20,20,0.8), rgba(10,10,10,0.9));
  border: 1px solid var(--border-light);
  border-top: 2px solid var(--accent);
  padding: 20px 24px;
  margin-bottom: 40px;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.world-info-capsule.visible {
  display: block;
  animation: fadeIn 0.8s ease;
}

.world-info-capsule h3 {
  font-family: var(--font-ui);
  color: var(--text-muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.world-info-capsule p {
  color: var(--accent);
  font-family: var(--font-story);
  font-size: 16px;
  line-height: 1.6;
}

/* 守秘人标签 */
.gm-label {
  display: none;
  font-family: var(--font-ui);
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
  opacity: 0.8;
}
.gm-label.visible {
  display: flex;
  align-items: center;
  gap: 8px;
}
.gm-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-active), transparent);
  opacity: 0.3;
}

/* 故事文本区 (TRPG 描述框风格) */
.story-wrapper {
  border-left: 2px solid var(--border-active);
  padding-left: 20px;
  margin-bottom: 40px;
}

.story-text {
  font-family: var(--font-story);
  font-size: 16.5px;
  line-height: 1.85; 
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.8px;
  text-align: justify;
  text-shadow: 0 0 1px rgba(255,255,255,0.1);
}

.cursor {
  display: inline-block;
  width: 6px;
  height: 1em;
  background: var(--accent);
  margin-left: 4px;
  vertical-align: middle;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 骰子打字指示器 */
.typing-indicator {
  display: none;
  color: var(--accent);
  font-family: var(--font-ui);
  font-size: 13px;
  margin-bottom: 30px;
  opacity: 0.7;
}

.typing-indicator.active {
  display: flex;
  align-items: center;
  gap: 10px;
  animation: pulse 2s infinite;
}

.typing-indicator i {
  animation: spin 3s linear infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* 行动选项区域 (Action Cards) */
.options-section-title {
  display: none;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin: 50px 0 20px 0;
  position: relative;
}
.options-section-title::before, .options-section-title::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 70px);
  height: 1px;
  background: var(--border-light);
}
.options-section-title::before { left: 0; }
.options-section-title::after { right: 0; }

.options-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-button {
  background: rgba(15, 15, 15, 0.8);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  color: var(--text-main);
  font-family: var(--font-story);
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.option-button::after {
  content: '\f6d1'; 
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: rgba(212, 175, 55, 0.03);
  transition: var(--transition);
}

.option-button:hover {
  background: rgba(212, 175, 55, 0.05);
  border-color: var(--border-active);
  transform: translateX(4px);
  box-shadow: inset 4px 0 0 0 var(--accent);
}

.option-button:hover::after {
  right: 10px;
  color: rgba(212, 175, 55, 0.1);
}

.option-button.selected {
  background: rgba(212, 175, 55, 0.1);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: inset 4px 0 0 0 var(--accent);
}

.option-button.disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

.option-number {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--accent);
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid var(--border-active);
  border-radius: 4px;
  padding: 2px 8px;
  margin-right: 16px;
  font-weight: 600;
  flex-shrink: 0;
}

/* 世界观选择界面 (战役模组选择) */
.world-selection {
  padding-top: 20px;
  padding-bottom: 60px;
}

.world-selection-title {
  text-align: center;
  margin-bottom: 40px;
  font-family: var(--font-story);
  font-size: 26px;
  color: var(--text-main);
  font-weight: 400;
  letter-spacing: 2px;
}

.world-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.world-card {
  background: rgba(18, 18, 18, 0.7);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 24px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.world-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.world-card:hover {
  background: rgba(25, 25, 25, 0.9);
  border-color: rgba(255, 255, 255, 0.15);
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

.world-card:hover::before {
  transform: scaleX(1);
}

.world-card h4 {
  font-family: var(--font-story);
  font-size: 18px;
  color: var(--text-main);
  font-weight: 500;
  z-index: 1;
}

.world-card h4 i {
  color: var(--accent);
  margin-right: 6px;
  font-size: 14px;
}

.world-card p {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  z-index: 1;
}

.loading-worlds {
  text-align: center;
  color: var(--accent);
  font-family: var(--font-ui);
  font-size: 14px;
  padding: 40px;
  letter-spacing: 1px;
}

.fade-in {
  animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .header-actions {
    width: 100%;
    justify-content: flex-start;
    flex-wrap: wrap;
  }
  .world-grid {
    grid-template-columns: 1fr;
  }
  .story-text {
    font-size: 15px;
  }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-title">
      <h1><i class="fa-solid fa-dice-d20"></i> <span data-i18n="title">幻境行者</span></h1>
      <p data-i18n="subtitle">落笔成界，选择你的战役模组</p>
    </div>
    <div class="header-actions">
      <button class="btn-glass" id="languageSelector">
        <i class="fa-solid fa-language"></i>
        <span id="currentLang">EN</span>
      </button>
      <button class="btn-glass hidden" id="resetWorldBtn">
        <i class="fa-solid fa-map-location-dot"></i>
        <span data-i18n="resetWorld">重置战役</span>
      </button>
      <button class="btn-glass hidden" id="clearStoryBtn">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span data-i18n="clearStory">新的轮回 (清空)</span>
      </button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="main-content">
    <div class="scroll-container" id="storyContainer">
      
      <!-- 战役模组设定头 -->
      <div class="world-info-capsule" id="currentWorldInfo">
        <h3 data-i18n="currentWorld">设定卷宗 / CAMPAIGN MODULE</h3>
        <p id="currentWorldDesc">世界观描述</p>
      </div>

      <!-- 守秘人标记 (TRPG 风格) -->
      <div class="gm-label" id="gmLabel">
        <i class="fa-solid fa-pen-nib"></i> 
        <span data-i18n="gmLog">守秘人日志 (Keeper's Log)</span>
      </div>

      <!-- 动态渲染区 -->
      <div id="storyContent">
        <div class="world-selection">
          <h2 class="world-selection-title" data-i18n="selectWorld">请选择初始模组</h2>
          <div class="loading-worlds">
            <i class="fa-solid fa-dice-d20 fa-spin"></i>
            <span data-i18n="loadingWorlds">正在加载多元宇宙设定...</span>
          </div>
          <div class="world-grid" id="worldOptions" style="display: none;"></div>
        </div>
      </div>

      <!-- 打字提示 -->
      <div class="typing-indicator" id="typingIndicator">
        <i class="fa-solid fa-dice-d20"></i> 
        <span data-i18n="aiWriting">命运的暗骰正在滚动...</span>
      </div>

      <!-- 行动分割线 -->
      <div class="options-section-title" id="optionsDivider" data-i18n="yourAction">◆ 你的行动 / ACTION ◆</div>
      
      <!-- 选项按钮容器 -->
      <div class="options-container" id="optionsContainer" style="display: none;">
      </div>

    </div>
  </main>
</div>

<script>
// 内嵌多语言配置，适配 TRPG 语境
const localesData = {
  "zh": {
    "title": "幻境行者",
    "subtitle": "落笔成界，选择你的战役模组",
    "resetWorld": "重置战役",
    "clearStory": "新的轮回 (清空)",
    "aiWriting": "命运的暗骰正在滚动...",
    "currentWorld": "设定卷宗 / CAMPAIGN MODULE",
    "gmLog": "守秘人日志 (Keeper's Log)",
    "yourAction": "◆ 你的行动 / ACTION ◆",
    "selectWorld": "请选择初始模组",
    "loadingWorlds": "正在加载多元宇宙设定...",
    "loadingError": "模组加载失败，请检定重试",
    "wsConnected": "已接入命运法则",
    "wsReconnecting": "与高维失去连接，正在重新检定...",
    "wsError": "无法接入命运法则",
    "parseError": "无法解读高维信息",
    "parseXMLError": "篇章解析异常"
  },
  "en": {
    "title": "Mirage Walker",
    "subtitle": "Ink becomes reality. Choose your campaign module.",
    "resetWorld": "Reset Campaign",
    "clearStory": "New Session (Clear)",
    "aiWriting": "Rolling the dice of fate...",
    "currentWorld": "CAMPAIGN MODULE",
    "gmLog": "Keeper's Log",
    "yourAction": "◆ YOUR ACTION ◆",
    "selectWorld": "Select Initial Module",
    "loadingWorlds": "Loading multiverse settings...",
    "loadingError": "Module load failed. Please roll again.",
    "wsConnected": "Connected to the Rules of Fate",
    "wsReconnecting": "Connection lost, attempting reconnection roll...",
    "wsError": "Failed to connect to Nexus",
    "parseError": "Failed to decode message",
    "parseXMLError": "Chapter parsing anomaly"
  }
};

const STORY_SYSTEM_PROMPT = `你是一个专业的TRPG守秘人（Game Master）。你需要根据用户的选择生成引人入胜的跑团故事内容和多个选项。请严格按照以下XML格式输出：

<story>[这里写故事内容，要生动有趣，有跑团的画面感，文风要克制、高级，长度大约150-300字]
</story>

<choice>选项1的描述</choice>
<choice>选项2的描述</choice>
<choice>选项3的描述</choice>

要求：
1. 故事内容连贯，符合所选世界观，像真正的TRPG守秘人一样描述环境、NPC反应和后果。
2. 每次提供2-4个行动选项。
3. 选项要有明显的不同方向（例如：调查、战斗、交涉、潜行等）。
4. 必须严格按照XML格式输出，不要添加其他内容。`;

let ws;
let isGenerating = false;
let lastProcessedContent = '';
let lastUpdateTime = 0;
let pendingUpdate = null;
let worldsData = null;
let currentWorld = null;

let storyTextElement = null;
let cursorElement = null;
let currentOptions = [];
let lastStoryLength = 0;
let lastOptionsState =[];
let optionElements =[]; 
let isNewScene = false; 

let currentLanguage = 'zh';
let scrollTimeout = null;
let isScrolling = false;

const UPDATE_INTERVAL = 80;

// DOM Nodes
const storyContent = document.getElementById('storyContent');
const optionsContainer = document.getElementById('optionsContainer');
const typingIndicator = document.getElementById('typingIndicator');
const resetWorldBtn = document.getElementById('resetWorldBtn');
const clearStoryBtn = document.getElementById('clearStoryBtn');
const currentWorldInfo = document.getElementById('currentWorldInfo');
const currentWorldDesc = document.getElementById('currentWorldDesc');
const languageSelector = document.getElementById('languageSelector');
const currentLangSpan = document.getElementById('currentLang');
const storyContainer = document.getElementById('storyContainer');
const gmLabel = document.getElementById('gmLabel');
const optionsDivider = document.getElementById('optionsDivider');

// Smooth Scroll
function smoothScrollToBottom(delay = 0) {
  if (scrollTimeout) clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    if (!isScrolling) {
      isScrolling = true;
      storyContainer.scrollTo({ top: storyContainer.scrollHeight, behavior: 'smooth' });
      setTimeout(() => { isScrolling = false; }, 500);
    }
  }, delay);
}

function instantScrollToBottom() {
  storyContainer.scrollTop = storyContainer.scrollHeight;
}

// i18n
async function initLanguage() {
  const savedLang = localStorage.getItem('story-adventure-lang') || 'zh';
  switchLanguage(savedLang);
}

function switchLanguage(lang) {
  if (!localesData[lang]) return;
  currentLanguage = lang;
  localStorage.setItem('story-adventure-lang', lang);
  
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  currentLangSpan.textContent = lang === 'zh' ? 'EN' : '中';
  
  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
    if (localesData[lang][key]) element.textContent = localesData[lang][key];
  });
  
  document.title = localesData[lang].title + " - TRPG";
  
  // 如果当前处于选择界面，重新渲染卡片
  if (document.querySelector('.world-selection')) {
    renderWorldOptions();
  }
}

function toggleLanguage() {
  switchLanguage(currentLanguage === 'zh' ? 'en' : 'zh');
}

function t(key) {
  return localesData[currentLanguage][key] || key;
}

// Load Worlds
async function loadWorlds() {
  try {
    const response = await fetch('./worlds.json');
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    worldsData = await response.json();
    renderWorldOptions();
  } catch (error) {
    console.error('Failed to load worlds:', error);
    const loadingElement = document.querySelector('.loading-worlds');
    if (loadingElement) loadingElement.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${t('loadingError')}</span>`;
  }
}

// 【修复核心1】：不要依赖全局的 worldOptions 元素，因为 innerHTML 覆盖会导致 DOM 脱离
function renderWorldOptions() {
  if (!worldsData || !worldsData.worlds) return;
  
  // 每次渲染都从文档中重新寻找容器，确保拿到的总是最新的 DOM 节点
  const gridContainer = document.getElementById('worldOptions');
  if (!gridContainer) return;
  
  const loadingElement = document.querySelector('.loading-worlds');
  if (loadingElement) loadingElement.style.display = 'none';
  
  gridContainer.innerHTML = '';
  gridContainer.style.display = 'grid';
  
  worldsData.worlds.forEach((world, index) => {
    const card = document.createElement('div');
    card.className = 'world-card fade-in';
    card.style.animationDelay = `${index * 0.05}s`;
    card.dataset.worldId = world.id;
    
    const name = world.name[currentLanguage] || world.name.zh || world.name;
    const description = world.description[currentLanguage] || world.description.zh || world.description;
    
    card.innerHTML = `
      <h4><i class="fa-solid fa-book-journal-whills"></i> ${name}</h4>
      <p>${description}</p>
    `;
    
    card.addEventListener('click', () => selectWorld(world));
    gridContainer.appendChild(card);
  });
}

function selectWorld(world) {
  if (isGenerating) return;
  currentWorld = world;
  const prompt = world.prompt[currentLanguage] || world.prompt.zh || world.prompt;
  
  const name = world.name[currentLanguage] || world.name.zh || world.name;
  const description = world.description[currentLanguage] || world.description.zh || world.description;
  currentWorldDesc.innerHTML = `<strong>[ ${name} ]</strong><br/>${description}`;
  currentWorldInfo.classList.add('visible');
  
  resetWorldBtn.classList.remove('hidden');
  clearStoryBtn.classList.remove('hidden');
  
  clearMessagesAndSelectWorld(prompt);
}

function clearMessagesAndSelectWorld(worldPrompt) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    console.error(t('wsError'));
    return;
  }
  // 选择模组时，清空 AI 记忆
  ws.send(JSON.stringify({ type: 'trigger_clear_message' }));
  
  // 稍微延迟确保清理完成
  setTimeout(() => { selectOption(worldPrompt); }, 100);
}

// 【修复核心2】：重置战役
function resetToWorldSelection() {
  // 清空服务器记忆
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'trigger_clear_message' }));
  }

  isGenerating = false;
  lastProcessedContent = '';
  lastUpdateTime = 0;
  currentWorld = null;
  storyTextElement = null;
  cursorElement = null;
  lastStoryLength = 0;
  lastOptionsState = [];
  optionElements =[];
  isNewScene = false;
  
  if (scrollTimeout) { clearTimeout(scrollTimeout); scrollTimeout = null; }
  isScrolling = false;
  
  resetWorldBtn.classList.add('hidden');
  clearStoryBtn.classList.add('hidden');
  currentWorldInfo.classList.remove('visible');
  typingIndicator.classList.remove('active');
  optionsDivider.style.display = 'none';
  optionsContainer.style.display = 'none';
  optionsContainer.innerHTML = '';
  gmLabel.classList.remove('visible');
  
  // 覆盖当前内容，渲染模组选择框架
  storyContent.innerHTML = `
    <div class="world-selection">
      <h2 class="world-selection-title" data-i18n="selectWorld">${t('selectWorld')}</h2>
      <div class="world-grid" id="worldOptions"></div>
    </div>
  `;
  
  // 重新渲染选择卡片 (这里会去抓取新的 #worldOptions 元素)
  renderWorldOptions();
  instantScrollToBottom();
}

function clearCurrentStory() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  
  ws.send(JSON.stringify({ type: 'trigger_clear_message' }));
  
  storyTextElement = null;
  cursorElement = null;
  lastStoryLength = 0;
  lastOptionsState =[];
  lastProcessedContent = '';
  optionElements =[];
  isNewScene = false;
  
  if (scrollTimeout) { clearTimeout(scrollTimeout); scrollTimeout = null; }
  isScrolling = false;
  
  storyContent.innerHTML = '';
  
  optionsContainer.innerHTML = '';
  optionsContainer.style.display = 'none';
  optionsDivider.style.display = 'none';
  typingIndicator.classList.remove('active');
  gmLabel.classList.remove('visible');
  
  if (currentWorld) {
    setTimeout(() => {
      const prompt = currentWorld.prompt[currentLanguage] || currentWorld.prompt.zh || currentWorld.prompt;
      selectOption(prompt);
    }, 200);
  }
}

// WS Init
function initWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'set_system_prompt', data: { text: STORY_SYSTEM_PROMPT } }));
    ws.send(JSON.stringify({ type: 'get_messages' }));
  };
  
  ws.onclose = () => { setTimeout(initWS, 5000); };
  
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'messages_update' || data.type === 'broadcast_messages') {
        handleAIResponse(data.data.messages);
      }
    } catch (error) {}
  };
}

function handleAIResponse(messages) {
  if (!messages || messages.length === 0) return;
  const lastMessage = messages[messages.length - 1];
  if (lastMessage.role === 'assistant' && lastMessage.content) {
    throttledProcessContent(lastMessage.content);
  }
}

function throttledProcessContent(content) {
  const now = Date.now();
  if (content === lastProcessedContent) return;
  
  if (now - lastUpdateTime < UPDATE_INTERVAL) {
    if (pendingUpdate) clearTimeout(pendingUpdate);
    pendingUpdate = setTimeout(() => {
      processIncrementalContent(content);
      lastUpdateTime = Date.now();
      pendingUpdate = null;
    }, UPDATE_INTERVAL - (now - lastUpdateTime));
    return;
  }
  
  processIncrementalContent(content);
  lastUpdateTime = now;
}

function processIncrementalContent(content) {
  lastProcessedContent = content;
  const parsedContent = parsePartialXML(content);
  
  if (parsedContent.hasStory || parsedContent.hasOptions) {
    incrementalUpdateDisplay(parsedContent);
  }
  
  if (isContentComplete(content)) {
    setTimeout(() => { finishStreaming(); }, 200);
  }
}

function parsePartialXML(content) {
  const result = { hasStory: false, hasOptions: false, storyText: '', options:[], isStoryComplete: false };
  try {
    const optionMatches = content.match(/<choice>.*?(<\/choice>|$)/gs);
    if (optionMatches) {
      result.hasOptions = true;
      result.options = optionMatches.map(match => {
        const optionText = match.replace(/<\/?choice>/gi, '').trim();
        return { text: optionText, complete: match.includes('</choice>') || match.includes('</Choice>') };
      });
    }

    const storyMatch = content.match(/<story>(.*?)(<\/story>|$)/is);
    if (storyMatch) {
      result.hasStory = true;
      result.storyText = storyMatch[1].trim();
      result.isStoryComplete = /<\/story>/i.test(content);
    } else {
      const choiceIndex = content.search(/<choice>/i);
      let rawStory = choiceIndex !== -1 ? content.substring(0, choiceIndex) : content;
      rawStory = rawStory.replace(/<think>[\s\S]*?(<\/think>|$)/gi, '');
      rawStory = rawStory.trim();
      
      if (rawStory.length > 0) {
        result.hasStory = true;
        result.storyText = rawStory;
        result.isStoryComplete = result.hasOptions;
      }
    }
  } catch (error) {}
  return result;
}

function incrementalUpdateDisplay(parsedContent) {
  if (parsedContent.hasStory && storyTextElement) {
    incrementalUpdateStory(parsedContent.storyText, parsedContent.isStoryComplete);
  }
  
  if (parsedContent.hasOptions) {
    incrementalUpdateOptions(parsedContent.options);
  }
}

function prepareForNewScene() {
  storyContent.innerHTML = '';
  
  gmLabel.classList.add('visible');
  typingIndicator.classList.add('active');
  
  const storyWrapper = document.createElement('div');
  storyWrapper.className = 'story-wrapper fade-in';
  
  storyTextElement = document.createElement('span');
  storyTextElement.className = 'story-text';
  
  cursorElement = document.createElement('span');
  cursorElement.className = 'cursor';
  
  storyWrapper.appendChild(storyTextElement);
  storyWrapper.appendChild(cursorElement);
  
  storyContent.appendChild(storyWrapper);
  
  lastStoryLength = 0;
  lastProcessedContent = '';
}

function incrementalUpdateStory(newStoryText, isComplete) {
  if (!storyTextElement) return;
  
  if (newStoryText.length > lastStoryLength) {
    const formattedText = newStoryText.replace(/\n/g, '<br>');
    storyTextElement.innerHTML = formattedText;
    
    lastStoryLength = newStoryText.length;
    smoothScrollToBottom(50);
  }
  if (cursorElement) cursorElement.style.display = isComplete ? 'none' : 'inline-block';
}

function incrementalUpdateOptions(newOptions) {
  if (shouldStartNewScene(newOptions)) {
    isNewScene = true;
    resetSelectionStates();
  }
  
  ensureOptionElements(newOptions.length);
  
  if (newOptions.length > 0) {
    optionsDivider.style.display = 'block';
    optionsContainer.style.display = 'flex';
  }
  
  for (let i = 0; i < newOptions.length; i++) {
    const newOption = newOptions[i];
    const lastOption = lastOptionsState[i];
    if (!lastOption || lastOption.text !== newOption.text || lastOption.complete !== newOption.complete) {
      updateOptionContent(i, newOption);
    }
  }
  
  hideExtraOptions(newOptions.length);
  lastOptionsState =[...newOptions];
  isNewScene = false;
  
  if (newOptions.length > 0) smoothScrollToBottom(100);
}

function shouldStartNewScene(newOptions) {
  if (lastOptionsState.length === 0) return false;
  if (Math.abs(newOptions.length - lastOptionsState.length) > 1) return true;
  
  if (newOptions.length > 0 && lastOptionsState.length > 0) {
    let similarCount = 0;
    for (let i = 0; i < Math.min(newOptions.length, lastOptionsState.length); i++) {
      const newText = newOptions[i].text.substring(0, 20);
      const oldText = lastOptionsState[i] ? lastOptionsState[i].text.substring(0, 20) : '';
      if (newText && oldText && newText.includes(oldText.substring(0, 10))) similarCount++;
    }
    return similarCount < Math.min(newOptions.length, lastOptionsState.length) / 2;
  }
  return false;
}

function ensureOptionElements(requiredCount) {
  while (optionElements.length < requiredCount) {
    const button = document.createElement('button');
    button.className = 'option-button fade-in';
    optionElements.push(button);
    optionsContainer.appendChild(button);
  }
  for (let i = 0; i < requiredCount; i++) {
    if (optionElements[i]) optionElements[i].style.display = 'flex';
  }
}

function updateOptionContent(index, option) {
  const button = optionElements[index];
  if (!button) return;
  
  if (isNewScene) {
    button.classList.remove('selected', 'disabled');
    button.onclick = null;
  }
  
  let displayText = option.text;
  if (!option.complete && displayText) {
    displayText += '...';
    button.classList.add('disabled');
    button.onclick = null;
  } else if (option.complete) {
    button.classList.remove('disabled');
    button.onclick = () => selectOption(option.text);
  }
  
  const numStr = (index + 1).toString().padStart(2, '0');
  const newHTML = `<span class="option-number">${numStr}</span> <span>${displayText}</span>`;
  if (button.innerHTML !== newHTML) button.innerHTML = newHTML;
}

function hideExtraOptions(activeCount) {
  for (let i = activeCount; i < optionElements.length; i++) {
    if (optionElements[i]) {
      optionElements[i].style.display = 'none';
      optionElements[i].classList.remove('selected', 'disabled');
      optionElements[i].onclick = null;
    }
  }
}

function resetSelectionStates() {
  optionElements.forEach(button => {
    button.classList.remove('selected', 'disabled');
    button.onclick = null;
  });
}

function isContentComplete(content) {
  const hasCompleteStory = content.includes('<story>') && content.includes('</story>');
  const optionMatches = content.match(/<choice>.*?<\/choice>/gs);
  const hasCompleteOptions = optionMatches && optionMatches.length > 0;
  return (hasCompleteStory && hasCompleteOptions) || (content.includes('</choice>') && content.indexOf('</choice>') === content.lastIndexOf('</choice>'));
}

function finishStreaming() {
  typingIndicator.classList.remove('active');
  if (cursorElement) cursorElement.style.display = 'none';
  
  optionElements.forEach((button, index) => {
    if (button.style.display !== 'none' && lastOptionsState[index]) {
      button.classList.remove('disabled');
      const spans = button.querySelectorAll('span');
      if (spans.length > 1) {
          spans[1].innerText = spans[1].innerText.replace('...', '');
      }
      if (lastOptionsState[index].complete) {
        button.onclick = () => selectOption(lastOptionsState[index].text);
      }
    }
  });
  
  isGenerating = false;
  lastProcessedContent = '';
  lastUpdateTime = 0;
  smoothScrollToBottom(200);
}

function selectOption(choice) {
  if (isGenerating) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    console.error(t('wsError'));
    return;
  }
  
  isGenerating = true;
  
  ws.send(JSON.stringify({ type: 'set_user_input', data: { text: choice } }));
  ws.send(JSON.stringify({ type: 'trigger_send_message' }));
  
  prepareForNewScene();
  
  markSelectedOption(choice);
  smoothScrollToBottom(100);
}

function markSelectedOption(selectedChoice) {
  optionElements.forEach((button) => {
    if (button.style.display === 'none') return;
    const spans = button.querySelectorAll('span');
    const btnText = spans.length > 1 ? spans[1].innerText.trim() : "";
    
    if (btnText === selectedChoice.trim() || btnText.includes(selectedChoice.substring(0, 20))) {
      button.classList.add('selected');
      button.classList.remove('disabled');
    } else {
      button.classList.add('disabled');
      button.classList.remove('selected');
    }
  });
}

// Events & Init
resetWorldBtn.addEventListener('click', resetToWorldSelection);
clearStoryBtn.addEventListener('click', clearCurrentStory);
languageSelector.addEventListener('click', toggleLanguage);

document.addEventListener('DOMContentLoaded', async () => {
  initLanguage();
  await loadWorlds();
});

initWS();
</script>
